<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don't 隨便 App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Nunito:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FB;--grid:transparent;--card:#FFFFFF;--ink:#3E4959;--line:#3E4959;--bd:rgba(62,73,89,.28);--sky:#CFDDEE;--blue:#8FB8DE;--brand:#5B8DBE;--mute:#7A8697;--ok:#4C8C6B;--hl:#E6F0FA;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Chiron GoRound TC","Noto Sans TC",system-ui,sans-serif;font-weight:500;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background-color:var(--bg);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:44px 44px}
header{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
header b{font-weight:900;font-size:19px;letter-spacing:.5px}
header b i{font-style:normal;color:var(--brand)}
.back{width:36px;height:36px;border:2.5px solid var(--line);border-radius:50%;background:var(--sky);font-weight:900;color:var(--ink);font-size:16px;box-shadow:2px 2px 0 var(--line);cursor:pointer}
.prog{display:flex;gap:6px;padding:0 18px 6px}
.prog span{flex:1;height:8px;border:2px solid var(--line);border-radius:8px;background:var(--card)}
.prog span.on{background:var(--ink)}
main{flex:1;overflow-y:auto;padding:8px 18px 20px}
h1{font-size:26px;font-weight:900;line-height:1.25;margin:6px 0 4px}
h2{font-size:17px;font-weight:900;margin:18px 0 8px}
p.sub{color:var(--mute);font-size:14px;line-height:1.5}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:4px 4px 0 var(--line);margin:12px 0}
.btn{display:block;width:100%;padding:15px;border:2.5px solid var(--line);border-radius:14px;background:var(--ink);color:var(--bg);font:900 17px "Noto Sans TC",sans-serif;box-shadow:4px 4px 0 var(--line);cursor:pointer;margin-top:16px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.alt{background:var(--sky);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:2.5px solid var(--line);border-radius:30px;background:var(--card);font:700 14px "Noto Sans TC",sans-serif;color:var(--ink);cursor:pointer}
.chip.on{background:var(--sky);box-shadow:2px 2px 0 var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:40px;height:40px;border:2.5px solid var(--line);border-radius:12px;background:var(--sky);font:900 20px sans-serif;color:var(--ink);cursor:pointer}
.big{font-size:30px;font-weight:900;min-width:60px;text-align:center}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.bar{height:14px;border:2px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .4s}
.tag{display:inline-block;padding:3px 10px;border:2px solid var(--line);border-radius:20px;font-size:12px;font-weight:900;background:var(--hl)}
.tl{border-left:3px dashed var(--ink);margin:8px 0 0 8px;padding-left:14px;font-size:14px;line-height:1.5}
.tl div{margin-bottom:6px;position:relative}
.tl div:before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--line)}
.opt{cursor:pointer}
.opt.sel{background:var(--sky)}
.v{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:2.5px solid var(--line);border-radius:12px;margin-top:8px;background:var(--card);cursor:pointer;font-size:14px}
.v.sel{background:var(--sky);box-shadow:2px 2px 0 var(--line)}
.v small{color:var(--mute);display:block;font-size:12px}
.spin{width:64px;height:64px;border:6px solid var(--sky);border-top-color:var(--ink);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
.center{text-align:center;padding-top:80px}
.save{background:var(--hl);border:2.5px solid var(--line);border-radius:14px;padding:12px;font-weight:900;text-align:center;margin-top:12px}
.stk{display:inline-flex;width:84px;height:84px;border:3px solid var(--line);border-radius:50%;background:var(--ok);color:#fff;font-size:44px;align-items:center;justify-content:center;box-shadow:4px 4px 0 var(--line)}
.av{display:inline-flex;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--sky);align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-right:-6px}
.inp{width:100%;padding:10px 12px;border:2.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 15px "Noto Sans TC",sans-serif;margin-top:10px}
.tm{width:110px;margin:0;font-weight:900}
.mini{width:34px;height:34px;border:2px solid var(--line);border-radius:10px;background:var(--sky);color:var(--ink);font-weight:900;margin-left:4px;cursor:pointer}
.role{display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%;font-family:inherit;color:var(--ink)}
.role span.e{font-size:38px}
.chip b{margin-left:4px;color:var(--brand)}
body #app{background-image:none;box-shadow:0 10px 40px rgba(62,73,89,.18)}
.card,.btn,.back,.chip.on,.v.sel,.stk{box-shadow:0 4px 14px rgba(62,73,89,.12)}
.card,.v,.inp,.chip,.back,.bar,.prog span,.tag,.save,.stk,.mini,.step button{border-width:1.5px;border-color:var(--bd)}
.btn{border-width:1.5px;border-color:var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn,.chip,.inp,.step button,.mini{font-family:inherit}
h1,header b{text-shadow:1px 2px 0 rgba(143,184,222,.5);letter-spacing:.5px}
body #app{position:relative}
.ov{position:absolute;inset:0;background:rgba(30,38,50,.45);display:flex;align-items:flex-end;z-index:9}
.sh{width:100%;max-height:80%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px}
.sh pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.7;margin:12px 0}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{transition:none}}
@media (min-width:500px){#app{height:min(900px,100%);margin:auto;border:3px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:8px 8px 0 var(--line)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const S={step:9,type:'企業團建',custom:'',n:30,bud:800,plan:0,sel:{},resp:0,timer:null,tags:{},pf:{},items:[],pname:''};
const TYPES=['企業團建','春酒尾牙','生日派對','校友會','社團活動'];
const STATS=[['不吃牛',.2],['素食',.1],['海鮮過敏',.1],['不喝酒',.35],['想玩互動遊戲',.5]];
const PLANS=[
 {name:'暖心餐敘',f:.9,tag:'最省預算',tl:['18:00 入場與迎賓飲','18:30 主餐（含素食、無牛選項）','19:30 輕量破冰：我說你猜','20:15 甜點與合照']},
 {name:'團建闖關',f:1,tag:'互動最高',tl:['14:00 分組報到','14:30 團隊闖關任務','16:00 主題下午茶','17:00 頒獎與心得分享']},
 {name:'質感派對',f:1.15,tag:'氛圍最好',tl:['18:00 迎賓調飲（含無酒精）','19:00 自助餐與現場演奏','20:00 抽獎互動','21:00 攝影合照散場']}];
const MODS=[['場地',.30,['光合包廂','木質空間','城市頂樓']],['外燴餐點',.45,['小森外燴','阿珍私廚','饗食工坊']],['音響設備',.10,['聲浪租賃','小喇叭','好聲音']],['攝影主持',.15,['留影工作室','阿宏主持','一刻攝影']]];
const F=[.92,1,1.12];
const money=x=>'NT$ '+Math.round(x).toLocaleString();
const logo=`<svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="9" width="28" height="28" rx="5" fill="none" stroke="#3E4959" stroke-width="3.5"/><path d="M10 6v6M24 6v6" stroke="#3E4959" stroke-width="3.5" stroke-linecap="round"/><rect x="9" y="19" width="5" height="4" fill="#A9B8DA"/><rect x="17" y="19" width="5" height="4" fill="#A9B8DA"/><rect x="9" y="27" width="5" height="4" fill="#A9B8DA"/><path d="M33 17L20 33l13-4z" fill="#8FB8DE" stroke="#3E4959" stroke-width="2.5" stroke-linejoin="round"/><path d="M34 14l7-6M34 14l7 8" stroke="#3E4959" stroke-width="2.5"/><circle cx="34" cy="14" r="3.5" fill="#8FB8DE" stroke="#3E4959" stroke-width="2.5"/><circle cx="42" cy="8" r="3" fill="#8FB8DE" stroke="#3E4959" stroke-width="2.5"/><circle cx="42" cy="22" r="3" fill="#8FB8DE" stroke="#3E4959" stroke-width="2.5"/></svg>`;
const total=()=>S.n*S.bud*PLANS[S.plan].f;
function go(s){clearInterval(S.timer);if(s<=6)S.mx=Math.max(S.mx||0,s);S.step=s;render()}
function render(){
 const s=S.step;
 const head=`<header>${BK[s]!==undefined?'<button class="back" aria-label="返回" onclick="go('+BK[s]+')">‹</button>':''}${logo}<b>DON<i>'</i>T 隨便</b></header>`;
 const prog=s>=1&&s<=5?`<div class="prog">${[1,2,3,4,5].map(i=>`<span class="${i<=s?'on':''}"></span>`).join('')}</div>`:'';
 $('#app').innerHTML=head+prog+'<main>'+V[s]()+'</main>';
 if(s===2)animate();
 if(s===12)quoteWait();
 if(s===3)setTimeout(()=>{if(S.step===3){S.gen=1;render()}},2200);
}
const V=[
// 0 首頁
()=>`<h1>告別隨便，<br>享受方便。</h1><p class="sub">3 分鐘生成企劃，辦一場每個人都真心喜歡的活動。</p>
<button class="btn" onclick="go(1)">開始辦活動</button>
<h2>我的活動</h2>
<div class="card"><div class="row"><b>Q3 部門聚餐</b><span class="tag">已完成</span></div><p class="sub">28 人・滿意度 4.8／5</p></div>
<div class="card"><div class="row"><b>新人迎新</b><span class="tag">已完成</span></div><p class="sub">15 人・省下 NT$ 6,200</p></div>`,
// 1 活動設定
()=>`<h1>辦什麼活動？</h1><p class="sub">三個問題，30 秒完成。</p>
<h2>活動類型</h2><div class="chips">${TYPES.map(t=>`<button class="chip ${S.type===t?'on':''}" onclick="S.type='${t}';S.custom='';render()">${t}</button>`).join('')}</div><input class="inp" placeholder="或自行填寫，例如：新品發表會" value="${esc(S.custom)}" oninput="S.custom=this.value;if(this.value)S.type=this.value">
<h2>參加人數</h2><div class="card row"><div class="step"><button aria-label="減少" onclick="S.n=Math.max(5,S.n-5);render()">−</button><span class="big">${S.n}</span><button aria-label="增加" onclick="S.n=Math.min(100,S.n+5);render()">＋</button></div><span class="sub">人</span></div>
<h2>每人預算：<span style="color:var(--brand)">${money(S.bud)}</span></h2><div class="card"><input type="range" min="300" max="2000" step="50" value="${S.bud}" oninput="S.bud=+this.value;this.parentNode.previousElementSibling.lastChild.textContent=money(S.bud)"><div class="row sub"><span>300</span><span>2,000</span></div></div>
${schedHTML()}<button class="btn" onclick="go(2)">下一步：邀請大家</button>`,
// 2 探詢
()=>`<h1>不再「都隨便」</h1><p class="sub">把連結丟進群組，AI 用聊天幫大家說出真心話，30 秒就能回覆。</p>
<div class="card"><div class="row"><b>已回覆</b><b><span id="rc">0</span> / ${S.n}</b></div><div class="bar"><i id="rb"></i></div>
<div style="margin-top:12px"><span class="av">小</span><span class="av">美</span><span class="av">阿</span><span class="av">凱</span><span class="av">+</span></div></div>
<div class="card" style="background:var(--hl)"><b>💬 AI 問：</b> <span class="sub" style="color:inherit">「下班想吃熱的還是涼的？有沒有什麼吃不了的？」</span></div>
<h2>群體偏好畫像</h2><div class="card">${STATS.map((x,i)=>`<div style="margin-bottom:10px"><div class="row" style="font-size:14px"><span>${x[0]}</span><b id="n${i}">0 人</b></div><div class="bar"><i id="b${i}"></i></div></div>`).join('')}</div>
<button class="btn" onclick="go(3)">產生活動企劃</button>`,
// 3 企劃
()=>!S.gen?`<div class="center"><div class="spin"></div><h1>AI 正在規劃…</h1><p class="sub">依預算、人數與大家的忌口配對中</p></div>`:
`<h1>為你準備 3 套企劃</h1><p class="sub">全部避開牛肉與海鮮，並加入無酒精選項。</p>
${PLANS.map((p,i)=>`<div class="card opt ${S.plan===i?'sel':''}" onclick="S.plan=${i};render()"><div class="row"><b style="font-size:18px">${p.name}</b><span class="tag">${p.tag}</span></div>
<div style="font-size:22px;font-weight:900;margin:4px 0">${money(S.bud*p.f)} <small style="font-size:13px;font-weight:500">／人</small></div>
${S.plan===i?'<div class="tl">'+p.tl.map(t=>`<div>${t}</div>`).join('')+'</div>':'<p class="sub">點開查看流程</p>'}</div>`).join('')}
<button class="btn" onclick="S.gen=0;S.sel={};go(4)">選這套，開始詢價</button>`,
// 4 比價
()=>{const T=total();let sum=0,avg=0;
 const mods=MODS.map((m,mi)=>{const base=T*m[1];const best=0;const pick=S.sel[mi]??0;sum+=base*F[pick];avg+=base;
 return `<h2>${m[0]}</h2>${m[2].map((v,vi)=>`<div class="v ${pick===vi?'sel':''}" onclick="S.sel[${mi}]=${vi};render()"><div>${v}<small>${vi===0?'24 小時內已報價・評價 4.9':'已報價・評價 '+(4.8-vi*.2).toFixed(1)}</small></div><div style="text-align:right"><b>${money(base*F[vi])}</b>${vi===0?'<br><span class="tag">最划算</span>':''}</div></div>`).join('')}`}).join('');
 const saved=Math.max(0,Math.round((1-sum/avg)*100));
 return `<h1>報價已收齊</h1><p class="sub">AI 已向 ${MODS.length*3} 家廠商詢價，點選可更換。</p>${mods}
 <div class="card"><div class="row"><span>合計（${S.n} 人）</span><b style="font-size:22px">${money(sum)}</b></div><div class="save">比市場均價省 ${saved}%・約 ${money(avg-sum)}</div></div>
 <button class="btn" onclick="S.final=${Math.round(sum)};go(5)">確認並簽約</button>`},
// 5 簽約
()=>`<h1>最後確認</h1><p class="sub">${PLANS[S.plan].name}・${S.type}・${S.n} 人</p>
<div class="card"><div class="row"><span>電子合約</span><span class="tag">待簽署</span></div><hr style="border:1.5px dashed var(--line);margin:12px 0"><div class="row"><span>款項託管（活動後才撥款）</span><b>${money(S.final)}</b></div></div>
<div class="card"><b>當天提醒</b><p class="sub">AI 會在前一天與當天提醒你，並通知廠商準時到位。</p></div>
<button class="btn" onclick="go(6)">簽署並付款託管</button>`,
// 6 完成
()=>`<div class="center" style="padding-top:50px"><span class="stk">✓</span><h1 style="margin-top:20px">搞定了！</h1><p class="sub">每個人的忌口都顧到了。<br>你只要準備好享受活動。</p></div>
<div class="card"><div class="row"><b>${PLANS[S.plan].name}</b><span class="tag">已確認</span></div><p class="sub">${S.n} 人・${money(S.final)}・已託管</p></div>
<button class="btn alt" onclick="S.step=0;S.gen=0;S.resp=0;render()">回首頁</button>`];
function animate(){S.resp=0;const t=S.timer=setInterval(()=>{S.resp=Math.min(S.n,S.resp+Math.ceil(S.n/12));
 const r=$('#rc');if(!r){clearInterval(t);return}
 r.textContent=S.resp;$('#rb').style.width=S.resp/S.n*100+'%';
 STATS.forEach((x,i)=>{const c=Math.round(S.resp*x[1]);$('#n'+i).textContent=c+' 人';$('#b'+i).style.width=x[1]*100+'%'});
 if(S.resp>=S.n)clearInterval(t)},180)}
const BK={0:9,1:0,2:1,3:2,4:10,5:4,7:9,10:3};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const TAGS=[['不吃牛',.2,0],['素食',.1,0],['海鮮過敏',.1,0],['不吃辣',.17,0],['不喝酒',.33,0],['互動遊戲',.5,1],['輕鬆聊天',.4,1],['表演節目',.2,1],['拍照打卡',.27,1],['抽獎',.45,1],['美食為主',.55,1]];
const sel=g=>TAGS.filter((t,i)=>S.tags[i]&&(g===undefined||t[2]===g)).map(t=>t[0]);
function tg(i){S.tags[i]=!S.tags[i];$('#t'+i).classList.toggle('on',!!S.tags[i])}
function tp(n,el){S.pf[n]=!S.pf[n];el.classList.toggle('on',!!S.pf[n])}
function animate(){S.resp=0;const t=S.timer=setInterval(()=>{S.resp=Math.min(S.n,S.resp+Math.ceil(S.n/12));const r=$('#rc');if(!r){clearInterval(t);return}r.textContent=S.resp;$('#rb').style.width=S.resp/S.n*100+'%';TAGS.forEach((x,i)=>{$('#n'+i).textContent=Math.round(S.resp*x[1])});if(S.resp>=S.n)clearInterval(t)},180)}
function openEd(){const p=PLANS[S.plan];S.pname=p.name;S.items=p.tl.map(x=>({time:x.slice(0,5),txt:x.slice(6),note:''}));sel(1).forEach(n=>{if(!S.items.some(it=>it.txt.includes(n)))S.items.splice(S.items.length-1,0,{time:'',txt:n,note:'依你選的標籤加入'})});go(10)}
function mv(i,d){const j=i+d;if(j<0||j>=S.items.length)return;[S.items[i],S.items[j]]=[S.items[j],S.items[i]];render()}
function dl(i){S.items.splice(i,1);render()}
const grp=(g)=>TAGS.map((t,i)=>t[2]===g?`<button class="chip ${S.tags[i]?'on':''}" id="t${i}" onclick="tg(${i})">${t[0]}<b><span id="n${i}">0</span>人</b></button>`:'').join('');
V[9]=()=>`<div style="text-align:center;padding-top:30px"><svg width="72" height="72" viewBox="0 0 48 48"><use href="#"/></svg></div>`;
V[9]=()=>`<h1 style="margin-top:30px">你是哪一位？</h1><p class="sub">選擇身分，開始使用 Don't 隨便。</p><div class="card"><button class="role" style="background:none;border:0" onclick="go(0)"><span class="e">🎯</span><span><b style="font-size:20px">主辦方</b><br><span class="sub">我要辦活動，統計大家的偏好並規劃</span></span></button></div><div class="card"><button class="role" style="background:none;border:0" onclick="go(7)"><span class="e">🙋</span><span><b style="font-size:20px">參與者</b><br><span class="sub">我收到邀請，30 秒說出真心話</span></span></button></div>`;
V[2]=()=>`<h1>不再「都隨便」</h1><p class="sub">把連結丟進群組，大家 30 秒就能回覆。</p><div class="card"><div class="row"><b>已回覆</b><b><span id="rc">0</span> / ${S.n}</b></div><div class="bar"><i id="rb"></i></div></div><h2>群體偏好標籤</h2><p class="sub">數字是人數，點選要納入企劃的標籤。</p><h2 style="font-size:15px">需要照顧的忌口</h2><div class="chips">${grp(0)}</div><h2 style="font-size:15px">大家想要的活動</h2><div class="chips">${grp(1)}</div><button class="btn" onclick="S.gen=0;go(3)">AI 規劃</button>`;

S.end='21:00';S.cands=[{d:'2026-11-20',s:'18:00',e:'21:00'},{d:'2026-11-21',s:'14:00',e:'17:00'}];S.rate={};

function pSched(){delete S.ext.d;const fx=S.dmode==='fixed';return `<div class="card"><div class="row" style="align-items:flex-start"><span class="sub">${fx?'時間':'日期'}</span><b style="text-align:right">${fx?whenTxt():'請選擇方便的時段'}</b></div><div class="row" style="margin-top:8px"><span class="sub">地區</span><b>${S.regions.join('、')}</b></div></div>`+(fx?'':`<h2>方便的時段（可複選）</h2>${PCHX('d',S.cands.filter(c=>c.d).map(cl),[])}`)}
